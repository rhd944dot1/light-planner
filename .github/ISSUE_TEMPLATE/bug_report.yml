name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: flow
    attributes:
      label: The flow involved
      description: The text under "In plain words" helps most. Please remove anything private.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Light Planner and Home Assistant
      placeholder: Light Planner 0.4.0, Home Assistant 2026.11.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log entries
      description: From Settings > System > Logs. Please remove anything private.
      render: text
